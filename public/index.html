<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remain</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="container">

    <!-- 页面标题 -->
    <header class="header">

      <div>
        <h1>Remain</h1>

        <p>
          定时保持网页活跃
        </p>
      </div>

    </header>


    <!-- 创建任务 -->
    <section class="card">

      <h2>添加任务</h2>

      <form id="task-form">

        <div class="form-group">

          <label for="url">
            网页 URL
          </label>

          <input
            id="url"
            name="url"
            type="url"
            placeholder="https://example.com"
            required
          >

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="interval">
              访问间隔（分钟）
            </label>

            <input
              id="interval"
              name="interval"
              type="number"
              min="1"
              value="5"
              required
            >

          </div>


          <div class="form-group">

            <label for="stay">
              停留时间（秒）
            </label>

            <input
              id="stay"
              name="stay"
              type="number"
              min="0"
              value="10"
              required
            >

          </div>

        </div>


        <button
          type="submit"
          class="primary-button"
        >
          添加任务
        </button>

      </form>

    </section>


    <!-- 任务列表 -->
    <section class="card">

      <div class="section-header">

        <h2>任务</h2>

        <button
          id="refresh-button"
          class="secondary-button"
          type="button"
        >
          刷新
        </button>

      </div>


      <div id="tasks">

        <div class="empty-state">
          暂无任务
        </div>

      </div>

    </section>


    <!-- 运行日志 -->
    <section class="card logs-section">

      <div class="section-header">

        <div>

          <h2>运行日志</h2>

          <p class="section-description">
            实时显示 Scheduler 和浏览器运行状态
          </p>

        </div>

        <button
          id="clear-logs-button"
          class="secondary-button"
          type="button"
        >
          清空显示
        </button>

      </div>


      <div
        id="logs"
        class="logs"
      >

        <div class="log-empty">
          等待日志...
        </div>

      </div>

    </section>

  </div>


  <script src="/app.js"></script>

</body>
</html>
