<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remain</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- =========================
       登录页面
       ========================= -->

  <div
    id="login-page"
    class="login-page"
  >
    <div class="login-card">

      <div class="login-header">
        <h1>Remain</h1>

        <p>
          请输入管理密码
        </p>
      </div>

      <form id="login-form">

        <div class="form-group">

          <label for="login-password">
            密码
          </label>

          <input
            id="login-password"
            type="password"
            autocomplete="current-password"
            placeholder="请输入密码"
            required
          >

        </div>

        <button
          type="submit"
          class="login-button"
        >
          登录
        </button>

        <div
          id="login-error"
          class="login-error"
        ></div>

      </form>

    </div>
  </div>


  <!-- =========================
       主应用
       ========================= -->

  <div
    id="app-page"
    class="app-page hidden"
  >

    <!-- Header -->

    <header class="app-header">

      <div class="header-inner">

        <div>
          <h1>Remain</h1>

          <p class="header-subtitle">
            定时访问任务管理
          </p>
        </div>

        <button
          id="logout-button"
          type="button"
          class="secondary-button"
        >
          退出登录
        </button>

      </div>

    </header>


    <!-- Main -->

    <main class="container">


      <!-- =========================
           创建任务
           ========================= -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h2>
              创建任务
            </h2>

            <p class="panel-description">
              创建一个新的定时访问任务
            </p>
          </div>

        </div>


        <form id="task-form">

          <!-- 任务名称 -->

          <div class="form-group">

            <label for="task-name">
              任务名称
            </label>

            <input
              id="task-name"
              name="name"
              type="text"
              maxlength="100"
              placeholder="例如：Google"
              required
            >

          </div>


          <!-- URL -->

          <div class="form-group">

            <label for="task-url">
              访问 URL
            </label>

            <input
              id="task-url"
              name="url"
              type="url"
              placeholder="https://example.com"
              required
            >

          </div>


          <!-- 执行参数 -->

          <div class="form-row">

            <div class="form-group">

              <label for="task-interval">
                执行间隔（分钟）
              </label>

              <input
                id="task-interval"
                name="interval_minutes"
                type="number"
                min="1"
                step="1"
                value="5"
                required
              >

            </div>


            <div class="form-group">

              <label for="task-stay">
                页面停留（秒）
              </label>

              <input
                id="task-stay"
                name="stay_seconds"
                type="number"
                min="0"
                step="1"
                value="10"
                required
              >

            </div>

          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="primary-button"
            >
              创建任务
            </button>

          </div>

        </form>

      </section>



      <!-- =========================
           任务列表
           ========================= -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h2 id="tasks-title">
              任务列表（共 0 个任务）
            </h2>

            <p class="panel-description">
              管理当前所有定时访问任务
            </p>
          </div>

          <button
            id="refresh-tasks-button"
            type="button"
            class="secondary-button"
          >
            刷新
          </button>

        </div>


        <div
          id="tasks-container"
          class="tasks-container"
        ></div>

      </section>



      <!-- =========================
           日志
           ========================= -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h2>
              运行日志
            </h2>

            <p class="panel-description">
              实时查看任务执行情况
            </p>
          </div>

          <button
            id="clear-logs-button"
            type="button"
            class="secondary-button danger-button"
          >
            清空日志
          </button>

        </div>


        <div
          id="logs-container"
          class="logs-container"
        ></div>

      </section>

    </main>

  </div>



  <!-- =========================
       编辑任务弹窗
       ========================= -->

  <div
    id="edit-task-modal"
    class="modal hidden"
  >

    <div
      class="modal-backdrop"
      id="edit-modal-backdrop"
    ></div>


    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-task-title"
    >

      <div class="modal-header">

        <div>

          <h2 id="edit-task-title">
            编辑任务
          </h2>

          <p class="panel-description">
            修改任务设置不会改变任务 ID
          </p>

        </div>

        <button
          id="close-edit-task-button"
          type="button"
          class="modal-close-button"
          aria-label="关闭"
        >
          ×
        </button>

      </div>


      <form id="edit-task-form">

        <input
          id="edit-task-id"
          type="hidden"
        >


        <!-- 任务名称 -->

        <div class="form-group">

          <label for="edit-task-name">
            任务名称
          </label>

          <input
            id="edit-task-name"
            type="text"
            maxlength="100"
            placeholder="请输入任务名称"
            required
          >

        </div>


        <!-- URL -->

        <div class="form-group">

          <label for="edit-task-url">
            访问 URL
          </label>

          <input
            id="edit-task-url"
            type="url"
            placeholder="https://example.com"
            required
          >

        </div>


        <!-- 执行参数 -->

        <div class="form-row">

          <div class="form-group">

            <label for="edit-task-interval">
              执行间隔（分钟）
            </label>

            <input
              id="edit-task-interval"
              type="number"
              min="1"
              step="1"
              required
            >

          </div>


          <div class="form-group">

            <label for="edit-task-stay">
              页面停留（秒）
            </label>

            <input
              id="edit-task-stay"
              type="number"
              min="0"
              step="1"
              required
            >

          </div>

        </div>


        <div class="form-actions modal-actions">

          <button
            id="cancel-edit-task-button"
            type="button"
            class="secondary-button"
          >
            取消
          </button>

          <button
            type="submit"
            class="primary-button"
          >
            保存修改
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="/app.js"></script>

</body>
</html>
