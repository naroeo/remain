```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remain</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- =========================
       Login Page
  ========================== -->

  <div
    id="login-page"
    class="login-page"
  >
    <div class="login-card">

      <div class="login-header">
        <h1>Remain</h1>
        <p>请输入管理密码</p>
      </div>

      <form id="login-form">

        <div class="form-group">
          <label for="login-password">
            密码
          </label>

          <input
            id="login-password"
            type="password"
            placeholder="请输入密码"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="login-button"
        >
          登录
        </button>

        <div
          id="login-error"
          class="login-error"
        ></div>

      </form>

    </div>
  </div>


  <!-- =========================
       Main App
  ========================== -->

  <div
    id="app-page"
    class="app-page hidden"
  >

    <header class="header">

      <div>
        <h1>Remain</h1>
        <p>任务管理</p>
      </div>

      <button
        id="logout-button"
        class="secondary-button"
      >
        退出登录
      </button>

    </header>


    <main class="container">

      <!-- =====================
           Create Task
      ====================== -->

      <section class="panel">

        <h2>添加任务</h2>

        <form id="taskForm">

          <div class="form-group">

            <label for="url">
              URL
            </label>

            <input
              id="url"
              name="url"
              type="url"
              placeholder="https://example.com"
              required
            >

          </div>


          <div class="form-row">

            <div class="form-group">

              <label for="interval_minutes">
                间隔（分钟）
              </label>

              <input
                id="interval_minutes"
                name="interval_minutes"
                type="number"
                min="1"
                value="5"
                required
              >

            </div>


            <div class="form-group">

              <label for="stay_seconds">
                停留（秒）
              </label>

              <input
                id="stay_seconds"
                name="stay_seconds"
                type="number"
                min="0"
                value="10"
                required
              >

            </div>

          </div>


          <button
            type="submit"
            class="primary-button"
          >
            添加任务
          </button>

        </form>

      </section>


      <!-- =====================
           Tasks
      ====================== -->

      <section class="panel">

        <div class="panel-header">

          <h2>任务列表</h2>

          <button
            id="refresh-button"
            class="secondary-button"
            type="button"
          >
            刷新
          </button>

        </div>

        <div id="tasks"></div>

      </section>


      <!-- =====================
           Logs
      ====================== -->

      <section class="panel">

        <div class="panel-header">

          <h2>运行日志</h2>

          <button
            id="clear-logs-button"
            class="secondary-button"
            type="button"
          >
            清空显示
          </button>

        </div>

        <div
          id="logs"
          class="logs"
        ></div>

      </section>

    </main>

  </div>


  <script src="/app.js"></script>

</body>
</html>
```
